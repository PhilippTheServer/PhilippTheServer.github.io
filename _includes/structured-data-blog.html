{%- comment -%}
  Blog node for /posts/. Without it the index is just another WebPage, and the articles
  beneath it have an `isPartOf` pointing at nothing. Emitted after the Person node.
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "@id": {{ site.url | append: "/posts/#blog" | jsonify }},
  "url": {{ "/posts/" | absolute_url | jsonify }},
  "name": {{ site.title | append: " — writing" | jsonify }},
  "description": {{ page.description | strip_newlines | strip | jsonify }},
  "inLanguage": {{ site.lang | jsonify }},
  "author": { "@id": {{ site.url | append: "/#person" | jsonify }} },
  "publisher": { "@id": {{ site.url | append: "/#person" | jsonify }} },
  "blogPost": [
    {%- for post in site.posts %}
    {
      "@type": "BlogPosting",
      "@id": {{ post.url | absolute_url | append: "#article" | jsonify }},
      "url": {{ post.url | absolute_url | jsonify }},
      "headline": {{ post.title | jsonify }},
      "datePublished": {{ post.date | date_to_xmlschema | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
