name: Medium import reminder

# Medium issues no new API tokens, so an article reaches Medium through its "Import a
# story" tool, which creates a draft with a canonical link back here; scripts/medium/
# medium.py imports and finishes that draft (#68). This opens one issue per newly
# deployed article so it is not forgotten.
on:
  workflow_run:
    workflows: ["Build, verify and deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  remind:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Open an issue for each post the deployed commit added
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- '_posts/*.md' > added.txt
          [ -s added.txt ] || { echo "no new posts"; exit 0; }
          while read -r file; do
            url=$(scripts/post-urls.sh "$file")
            slug=$(basename "$file" .md | cut -c12-)
            title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "$file" | head -1)
            if gh issue list --label medium --state all --search "\"$url\" in:body" --json number -q '.[0].number' | grep -q .; then
              echo "already tracked: $url"
              continue
            fi
            gh issue create --label medium --title "Import to Medium: $title" --body "$(printf '%s\n' \
              "Article: $url" \
              "" \
              "1. Run \`uv run scripts/medium/medium.py sync $slug\` (start the browser first with \`uv run scripts/medium/medium.py browser\` if it is not running). It imports the article, finishes the draft and checks it against the site." \
              "2. Publish the draft on Medium and close this issue.")"
          done < added.txt
