name: Medium import reminder

# Medium issues no new API tokens, so an article reaches Medium through its "Import a
# story" tool, which creates a draft with a canonical link back here. This opens one
# issue per newly deployed article so the import is not forgotten.
on:
  workflow_run:
    workflows: ["Build, verify and deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  remind:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Open an issue for each post the deployed commit added
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- '_posts/*.md' > added.txt
          [ -s added.txt ] || { echo "no new posts"; exit 0; }
          while read -r file; do
            url=$(scripts/post-urls.sh "$file")
            title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "$file" | head -1)
            if gh issue list --label medium --state all --search "\"$url\" in:body" --json number -q '.[0].number' | grep -q .; then
              echo "already tracked: $url"
              continue
            fi
            gh issue create --label medium --title "Import to Medium: $title" --body "$(printf '%s\n' \
              "1. Open https://medium.com/p/import" \
              "2. Paste $url and import. Medium creates a draft with the canonical link set to that URL." \
              "3. Check code blocks and tables in the draft, add up to five tags, publish, and close this issue.")"
          done < added.txt
