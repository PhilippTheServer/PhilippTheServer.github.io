title: "Philipp Lehmann"
tagline: "I like building infrastructure, mostly so I can break it again."
description: >-
  Infrastructure engineer in Bochum, Germany. CTO at Nerd Force1 UG (AI-Gruppe)
  and IT-Security student at Ruhr-Universität Bochum.
  I write about container platforms, distributed storage, and automating
  everything that shouldn't be done twice.
url: "https://philipptheserver.com"
baseurl: ""
lang: en
timezone: Europe/Berlin

author:
  name: "Philipp Lehmann"
  email: "philipp.lehmann@gruppe.ai"
  uri: "https://philipptheserver.com"
  orcid: "0009-0002-3922-2471"
  github: "PhilippTheServer"
  linkedin: "https://www.linkedin.com/in/philipp-lehmann-17995521b/"

feed:
  path: feed.xml
  posts_limit: 20
  title: "Philipp Lehmann — writing"

# Articles are posts; the date lives in the front matter, not in the URL.
permalink: /posts/:title/

# Projects, one file each in _work/, rendered at /work/<file name>/ (#74).
collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { type: work }
    values: { layout: work }

markdown: kramdown

# Code is shipped as plain <pre><code> and highlighted in the browser by highlight.js,
# because Medium's importer drops Rouge's span-per-token markup (#56).
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

# highlight.js grammars outside its common bundle, vendored in assets/vendor/highlight.js/.
highlight_extra_languages: [dockerfile, nginx, cmake, django]

plugins:
  - jekyll-feed
  - jekyll-sitemap

include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - scripts/
  - docs/
  - README.md
  - CLAUDE.md
